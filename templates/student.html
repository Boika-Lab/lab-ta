<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2E86AB" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Lab TA" />
  <link rel="apple-touch-icon" href="https://placehold.co/180x180/2E86AB/white?text=TA" />
  <title>Lab TA</title>
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #2E86AB;
      --blue-dark: #246d8c;
      --bg: #f0f2f5;
      --card: #ffffff;
      --user-bubble: #2E86AB;
      --ta-bubble: #ffffff;
      --border: #e0e0e0;
      --text: #1a1a2e;
      --muted: #666;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
    }

    /* ── Layout ───────────────────────────────────────── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
      max-width: 760px;
      margin: 0 auto;
    }

    /* ── Header ───────────────────────────────────────── */
    #header {
      background: var(--blue);
      color: #fff;
      padding: 0.85rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    #header-left {
      display: flex;
      flex-direction: column;
    }
    #header-left span:first-child {
      font-size: 0.7rem;
      opacity: 0.8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    #lab-name-el {
      font-size: 1rem;
      font-weight: 700;
    }
    #tts-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.4rem;
      cursor: pointer;
      padding: 0.3rem;
      line-height: 1;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background 0.15s;
    }
    #tts-btn:hover { background: rgba(255,255,255,0.15); }

    /* ── Chat area ────────────────────────────────────── */
    #chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      -webkit-overflow-scrolling: touch;
    }

    /* Welcome message */
    .welcome {
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
      padding: 1rem;
      line-height: 1.6;
    }
    .welcome strong { color: var(--blue); }

    /* Message rows */
    .msg-row {
      display: flex;
      gap: 0.6rem;
      max-width: 85%;
    }
    .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.ta   { align-self: flex-start; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #e0ecf1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .msg-row.user .avatar { background: #bcd8e6; }

    .bubble {
      padding: 0.65rem 0.9rem;
      border-radius: 16px;
      line-height: 1.55;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg-row.user .bubble {
      background: var(--user-bubble);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg-row.ta .bubble {
      background: var(--ta-bubble);
      color: var(--text);
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    /* Typing indicator */
    .typing-row { align-self: flex-start; display: flex; gap: 0.6rem; }
    .typing-dots {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0.65rem 0.9rem;
      background: var(--ta-bubble);
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    .typing-dots span {
      width: 7px; height: 7px;
      background: #aaa;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%           { transform: translateY(-6px); }
    }

    /* ── Input bar ────────────────────────────────────── */
    #input-bar {
      background: #fff;
      border-top: 1px solid var(--border);
      padding: 0.6rem 0.75rem;
      padding-bottom: max(0.6rem, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .icon-btn {
      min-width: 44px;
      min-height: 44px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      transition: background 0.15s, transform 0.1s;
      flex-shrink: 0;
    }
    .icon-btn:active { transform: scale(0.92); }

    #mic-btn {
      background: #e8f4f9;
      color: var(--blue);
    }
    #mic-btn.listening {
      background: #fee;
      color: #c0392b;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(192,57,43,0.4); }
      50%       { box-shadow: 0 0 0 8px rgba(192,57,43,0); }
    }

    #text-input {
      flex: 1;
      border: 1.5px solid var(--border);
      border-radius: 22px;
      padding: 0.6rem 1rem;
      font-size: 1rem;
      outline: none;
      background: #f9f9f9;
      min-height: 44px;
      transition: border-color 0.2s;
      font-family: inherit;
    }
    #text-input:focus { border-color: var(--blue); background: #fff; }

    #send-btn {
      background: var(--blue);
      color: #fff;
    }
    #send-btn:hover { background: var(--blue-dark); }
    #send-btn:disabled { background: #b0cdd8; cursor: not-allowed; }

    /* ── A2HS banner ──────────────────────────────────── */
    #a2hs-banner {
      display: none;
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: #1a1a2e;
      color: #fff;
      padding: 0.75rem 1.25rem;
      border-radius: 10px;
      font-size: 0.85rem;
      max-width: 320px;
      width: calc(100% - 2rem);
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      z-index: 100;
      text-align: center;
      line-height: 1.5;
    }
    #a2hs-banner button {
      margin-top: 0.5rem;
      padding: 0.3rem 0.9rem;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    /* ── Error toast ──────────────────────────────────── */
    #toast {
      display: none;
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: #c0392b;
      color: #fff;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-size: 0.85rem;
      z-index: 200;
      max-width: 340px;
      text-align: center;
    }

    @media (max-width: 480px) {
      .msg-row { max-width: 92%; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="header">
      <div id="header-left">
        <span>Lab TA</span>
        <span id="lab-name-el">Loading...</span>
      </div>
      <button id="tts-btn" title="Toggle text-to-speech" aria-label="Toggle voice">🔊</button>
    </div>

    <div id="chat-area">
      <div class="welcome" id="welcome-msg">
        <strong>Welcome to your Lab TA!</strong><br />
        Ask a question about the lab — the TA will guide you with questions and hints to help you discover the answers yourself.
      </div>
    </div>

    <div id="input-bar">
      <button class="icon-btn" id="mic-btn" title="Voice input" aria-label="Voice input">🎤</button>
      <input type="text" id="text-input" placeholder="Ask the TA..." autocomplete="off" />
      <button class="icon-btn" id="send-btn" title="Send" aria-label="Send">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="a2hs-banner">
    Add Lab TA to your home screen for quick access!
    <br/>
    <button onclick="dismissA2HS()">Got it</button>
  </div>

  <div id="toast"></div>

  <script>
    // ── Token from URL ─────────────────────────────────────────────────────────
    const token = window.location.pathname.split('/').filter(Boolean).pop();

    // ── State ──────────────────────────────────────────────────────────────────
    const history = [];   // [{role: "user"|"model", text: "..."}]
    let ttsEnabled = true;
    let currentUtterance = null;

    // ── DOM refs ───────────────────────────────────────────────────────────────
    const chatArea  = document.getElementById('chat-area');
    const textInput = document.getElementById('text-input');
    const sendBtn   = document.getElementById('send-btn');
    const micBtn    = document.getElementById('mic-btn');
    const ttsBtn    = document.getElementById('tts-btn');
    const labNameEl = document.getElementById('lab-name-el');

    // ── Load lab info ──────────────────────────────────────────────────────────
    (async () => {
      try {
        const res  = await fetch(`/api/lab/${token}`);
        if (!res.ok) throw new Error('Lab not found');
        const data = await res.json();
        labNameEl.textContent = data.lab_name;
        document.title = `Lab TA — ${data.lab_name}`;
      } catch (e) {
        labNameEl.textContent = 'Lab TA';
      }
    })();

    // ── Rendering helpers ──────────────────────────────────────────────────────
    function appendMessage(role, text) {
      const row = document.createElement('div');
      row.className = `msg-row ${role === 'user' ? 'user' : 'ta'}`;

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = role === 'user' ? '🧑' : '🧪';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;

      if (role === 'ta') {
        const inner = document.createElement('div');
        inner.style.display = 'flex';
        inner.style.flexDirection = 'column';
        const label = document.createElement('span');
        label.style.cssText = 'font-size:0.72rem;color:#888;margin-bottom:3px;font-weight:600;';
        label.textContent = 'Lab TA';
        inner.appendChild(label);
        inner.appendChild(bubble);
        row.appendChild(avatar);
        row.appendChild(inner);
      } else {
        row.appendChild(avatar);
        row.appendChild(bubble);
      }

      chatArea.appendChild(row);
      scrollToBottom();
      return bubble;
    }

    function showTyping() {
      const row = document.createElement('div');
      row.className = 'typing-row';
      row.id = 'typing-indicator';

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = '🧪';

      const dots = document.createElement('div');
      dots.className = 'typing-dots';
      dots.innerHTML = '<span></span><span></span><span></span>';

      row.appendChild(avatar);
      row.appendChild(dots);
      chatArea.appendChild(row);
      scrollToBottom();
    }

    function removeTyping() {
      const el = document.getElementById('typing-indicator');
      if (el) el.remove();
    }

    function scrollToBottom() {
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 3500);
    }

    // ── Send message ───────────────────────────────────────────────────────────
    async function sendMessage(text) {
      text = text.trim();
      if (!text) return;

      document.getElementById('welcome-msg')?.remove();
      textInput.value = '';
      sendBtn.disabled = true;

      appendMessage('user', text);
      showTyping();

      try {
        const res = await fetch(`/api/chat/${token}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, history: [...history] }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Server error');

        history.push({ role: 'user', text });
        history.push({ role: 'model', text: data.response });

        removeTyping();
        const taBubble = appendMessage('ta', data.response);
        if (window.MathJax) MathJax.typesetPromise([taBubble]);
        speakText(data.response);
      } catch (err) {
        removeTyping();
        showToast('Error: ' + err.message);
        // Put the text back so user can retry
        textInput.value = text;
      } finally {
        sendBtn.disabled = false;
        textInput.focus();
      }
    }

    sendBtn.addEventListener('click', () => sendMessage(textInput.value));
    textInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage(textInput.value);
      }
    });

    // ── TTS ────────────────────────────────────────────────────────────────────
    function speakText(text) {
      if (!ttsEnabled || !window.speechSynthesis) return;
      if (currentUtterance) window.speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(text);
      utt.rate = 0.9;
      currentUtterance = utt;
      const voices = window.speechSynthesis.getVoices();
      if (voices.length > 0) {
        window.speechSynthesis.speak(utt);
      } else {
        const onVoicesReady = () => {
          window.speechSynthesis.removeEventListener('voiceschanged', onVoicesReady);
          window.speechSynthesis.speak(utt);
        };
        window.speechSynthesis.addEventListener('voiceschanged', onVoicesReady);
      }
    }

    ttsBtn.addEventListener('click', () => {
      ttsEnabled = !ttsEnabled;
      ttsBtn.textContent = ttsEnabled ? '🔊' : '🔇';
      if (!ttsEnabled && window.speechSynthesis) window.speechSynthesis.cancel();
    });

    // ── Voice input ────────────────────────────────────────────────────────────
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let listening = false;

    if (!SpeechRecognition) {
      micBtn.style.display = 'none';
    } else {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onresult = (e) => {
        const transcript = e.results[0][0].transcript;
        textInput.value = transcript;
        stopListening();
        sendMessage(transcript);
      };

      recognition.onerror = () => stopListening();
      recognition.onend   = () => stopListening();

      micBtn.addEventListener('click', () => {
        if (listening) {
          recognition.stop();
          stopListening();
        } else {
          startListening();
        }
      });
    }

    function startListening() {
      listening = true;
      micBtn.classList.add('listening');
      textInput.placeholder = 'Listening...';
      recognition.start();
    }

    function stopListening() {
      listening = false;
      micBtn.classList.remove('listening');
      textInput.placeholder = 'Ask the TA...';
    }

    // ── PWA: Add to Home Screen prompt ────────────────────────────────────────
    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    if (isMobile && !window.matchMedia('(display-mode: standalone)').matches) {
      setTimeout(() => {
        const banner = document.getElementById('a2hs-banner');
        banner.style.display = 'block';
      }, 30000);
    }

    function dismissA2HS() {
      document.getElementById('a2hs-banner').style.display = 'none';
    }
  </script>
</body>
</html>
