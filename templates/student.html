<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2E86AB" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Lab TA" />
  <link rel="apple-touch-icon" href="https://placehold.co/180x180/2E86AB/white?text=TA" />
  <title>Lab TA</title>
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #2E86AB;
      --blue-dark: #246d8c;
      --bg: #f0f2f5;
      --card: #ffffff;
      --user-bubble: #2E86AB;
      --ta-bubble: #ffffff;
      --border: #e0e0e0;
      --text: #1a1a2e;
      --muted: #666;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
    }

    /* ── Layout ───────────────────────────────────────── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
      max-width: 760px;
      margin: 0 auto;
    }

    /* ── Header ───────────────────────────────────────── */
    #header {
      background: var(--blue);
      color: #fff;
      padding: 0.85rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    #header-left {
      display: flex;
      flex-direction: column;
    }
    #header-left span:first-child {
      font-size: 0.7rem;
      opacity: 0.8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    #lab-name-el {
      font-size: 1rem;
      font-weight: 700;
    }
    #tts-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.4rem;
      cursor: pointer;
      padding: 0.3rem;
      line-height: 1;
      min-width: 44px;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background 0.15s;
    }
    #tts-btn:hover { background: rgba(255,255,255,0.15); }

    /* ── Chat area ────────────────────────────────────── */
    #chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      -webkit-overflow-scrolling: touch;
    }

    /* Welcome message */
    .welcome {
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
      padding: 1rem;
      line-height: 1.6;
    }
    .welcome strong { color: var(--blue); }

    /* Message rows */
    .msg-row {
      display: flex;
      gap: 0.6rem;
      max-width: 85%;
    }
    .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.ta   { align-self: flex-start; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #e0ecf1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .msg-row.user .avatar { background: #bcd8e6; }

    .bubble {
      padding: 0.65rem 0.9rem;
      border-radius: 16px;
      line-height: 1.55;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg-row.user .bubble {
      background: var(--user-bubble);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg-row.ta .bubble {
      background: var(--ta-bubble);
      color: var(--text);
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    /* Typing indicator */
    .typing-row { align-self: flex-start; display: flex; gap: 0.6rem; }
    .typing-dots {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0.65rem 0.9rem;
      background: var(--ta-bubble);
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    .typing-dots span {
      width: 7px; height: 7px;
      background: #aaa;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%           { transform: translateY(-6px); }
    }

    /* ── Input bar ────────────────────────────────────── */
    #input-bar {
      background: #fff;
      border-top: 1px solid var(--border);
      padding: 0.6rem 0.75rem;
      padding-bottom: max(0.6rem, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .icon-btn {
      min-width: 44px;
      min-height: 44px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      transition: background 0.15s, transform 0.1s;
      flex-shrink: 0;
    }
    .icon-btn:active { transform: scale(0.92); }

    #mic-btn {
      background: #e8f4f9;
      color: var(--blue);
    }
    #mic-btn.listening {
      background: #fee;
      color: #c0392b;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(192,57,43,0.4); }
      50%       { box-shadow: 0 0 0 8px rgba(192,57,43,0); }
    }

    #text-input {
      flex: 1;
      border: 1.5px solid var(--border);
      border-radius: 22px;
      padding: 0.6rem 1rem;
      font-size: 1rem;
      outline: none;
      background: #f9f9f9;
      min-height: 44px;
      transition: border-color 0.2s;
      font-family: inherit;
    }
    #text-input:focus { border-color: var(--blue); background: #fff; }

    #send-btn {
      background: var(--blue);
      color: #fff;
    }
    #send-btn:hover { background: var(--blue-dark); }
    #send-btn:disabled { background: #b0cdd8; cursor: not-allowed; }

    /* ── A2HS banner ──────────────────────────────────── */
    #a2hs-banner {
      display: none;
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: #1a1a2e;
      color: #fff;
      padding: 0.75rem 1.25rem;
      border-radius: 10px;
      font-size: 0.85rem;
      max-width: 320px;
      width: calc(100% - 2rem);
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      z-index: 100;
      text-align: center;
      line-height: 1.5;
    }
    #a2hs-banner button {
      margin-top: 0.5rem;
      padding: 0.3rem 0.9rem;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    /* ── Error toast ──────────────────────────────────── */
    #toast {
      display: none;
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: #c0392b;
      color: #fff;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-size: 0.85rem;
      z-index: 200;
      max-width: 340px;
      text-align: center;
    }

    @media (max-width: 480px) {
      .msg-row { max-width: 92%; }
    }

    /* ── Quiz panel ───────────────────────────────────── */
    #quiz-panel {
      display: none;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
      padding: 1.5rem 1rem;
      background: var(--bg);
      -webkit-overflow-scrolling: touch;
      gap: 0;
    }

    #quiz-panel.quiz-feedback-default { background: var(--bg); }
    #quiz-panel.quiz-feedback-success { background: #e7f6ed; }
    #quiz-panel.quiz-feedback-warning { background: #fff4cf; }
    #quiz-panel.quiz-feedback-danger  { background: #fde7e7; }

    .quiz-card {
      background: var(--card);
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.09);
      padding: 1.75rem 1.5rem;
      width: 100%;
      max-width: 500px;
    }

    .quiz-icon {
      font-size: 2.5rem;
      text-align: center;
      margin-bottom: 0.75rem;
    }

    .quiz-card h2 {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
      text-align: center;
      margin-bottom: 0.55rem;
    }

    .quiz-card p {
      font-size: 0.9rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
      margin-bottom: 1.25rem;
    }

    .quiz-progress-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.65rem;
      text-align: center;
      width: 100%;
      max-width: 500px;
    }

    .quiz-question-text {
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.55;
      margin-bottom: 1rem;
    }

    .quiz-choices {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.1rem;
    }

    .choice-opt {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.65rem 0.9rem;
      border: 1.5px solid #d0d5dd;
      border-radius: 9px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .choice-opt:hover:not(.disabled) {
      border-color: var(--blue);
      background: #f0f8fc;
    }

    .choice-opt.is-correct  { border-color: #1a7a4a; background: #f0faf5; }
    .choice-opt.is-wrong    { border-color: #c0392b; background: #fff5f5; }
    .choice-opt.disabled    { cursor: default; }

    .choice-opt input[type="radio"] { accent-color: var(--blue); flex-shrink: 0; }

    .choice-letter {
      font-weight: 700;
      font-size: 0.88rem;
      color: var(--blue);
      width: 1.25em;
      flex-shrink: 0;
    }

    .choice-text {
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.4;
    }

    .quiz-feedback {
      font-size: 0.9rem;
      border-radius: 8px;
      padding: 0.65rem 0.9rem;
      margin-bottom: 1rem;
      line-height: 1.5;
    }

    .quiz-feedback.correct { background:#f0faf5; color:#1a7a4a; border:1px solid #a8d5b9; }
    .quiz-feedback.wrong   { background:#fff5f5; color:#c0392b; border:1px solid #f5c6cb; }

    .btn-quiz {
      width: 100%;
      padding: 0.8rem;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 9px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-quiz:hover    { background: var(--blue-dark); }
    .btn-quiz:disabled { background: #b0cdd8; cursor: not-allowed; }

    .round-score {
      font-size: 1.25rem;
      font-weight: 700;
      text-align: center;
      color: var(--text);
      margin-bottom: 0.65rem;
    }

    .failed-list {
      list-style: none;
      margin: 0 0 1.25rem;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .failed-list li {
      font-size: 0.85rem;
      color: #c0392b;
      padding: 0.35rem 0.6rem;
      background: #fff5f5;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="header">
      <div id="header-left">
        <span>Lab TA</span>
        <span id="lab-name-el">Loading...</span>
      </div>
      <button id="tts-btn" title="Toggle text-to-speech" aria-label="Toggle voice">🔊</button>
    </div>

    <div id="quiz-panel"></div>

    <div id="chat-area">
      <div class="welcome" id="welcome-msg">
        <strong>Welcome to your Lab TA!</strong><br />
        Ask a question about the lab — the TA will guide you with questions and hints to help you discover the answers yourself.
      </div>
    </div>

    <div id="input-bar">
      <button class="icon-btn" id="mic-btn" title="Voice input" aria-label="Voice input">🎤</button>
      <input type="text" id="text-input" placeholder="Ask the TA..." autocomplete="off" />
      <button class="icon-btn" id="send-btn" title="Send" aria-label="Send">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="a2hs-banner">
    Add Lab TA to your home screen for quick access!
    <br/>
    <button onclick="dismissA2HS()">Got it</button>
  </div>

  <div id="toast"></div>

  <script>
    // ── Token from URL ─────────────────────────────────────────────────────────
    const token = window.location.pathname.split('/').filter(Boolean).pop();
    const LS_CHAT_SESSION = `labta_chat_session_${token}`;

    function getChatSessionId() {
      let sessionId = localStorage.getItem(LS_CHAT_SESSION);
      if (!sessionId) {
        sessionId = window.crypto?.randomUUID
          ? window.crypto.randomUUID()
          : `session-${Date.now()}-${Math.random().toString(36).slice(2)}`;
        localStorage.setItem(LS_CHAT_SESSION, sessionId);
      }
      return sessionId;
    }

    const chatSessionId = getChatSessionId();

    // ── State ──────────────────────────────────────────────────────────────────
    const history = [];   // [{role: "user"|"model", text: "..."}]
    let ttsEnabled = true;
    let currentUtterance = null;
    let quizEnabled = true;
    let taEnabled = true;

    // ── DOM refs ───────────────────────────────────────────────────────────────
    const chatArea  = document.getElementById('chat-area');
    const textInput = document.getElementById('text-input');
    const sendBtn   = document.getElementById('send-btn');
    const micBtn    = document.getElementById('mic-btn');
    const ttsBtn    = document.getElementById('tts-btn');
    const labNameEl = document.getElementById('lab-name-el');

    // ── Load lab info + init quiz ──────────────────────────────────────────────
    (async () => {
      try {
        const res  = await fetch(`/api/lab/${token}`);
        if (res.status === 404) { showLabUnavailable(); return; }
        if (!res.ok) throw new Error('Lab not found');
        const data = await res.json();
        labNameEl.textContent = data.lab_name;
        document.title = `Lab TA — ${data.lab_name}`;
        quizEnabled = data.quiz_enabled;
        taEnabled = data.ta_enabled;
      } catch (e) {
        labNameEl.textContent = 'Lab TA';
      }
      initializeFeatureAvailability();
      if (quizEnabled) await initQuiz();
    })();

    function initializeFeatureAvailability() {
      if (!taEnabled) {
        ttsBtn.style.display = 'none';
        document.getElementById('input-bar').style.display = 'none';
      }
      if (!quizEnabled && !taEnabled) {
        showStudentUnavailable('No student activities are currently enabled for this lab.');
      } else if (!quizEnabled && taEnabled) {
        hideQuizPanel();
      } else if (quizEnabled && !taEnabled) {
        chatArea.style.display = 'none';
      }
    }

    function showStudentUnavailable(message) {
      document.getElementById('quiz-panel').style.display = 'none';
      document.getElementById('input-bar').style.display = 'none';
      chatArea.style.display = 'flex';
      chatArea.innerHTML = `<div class="welcome"><strong>${qEsc(message)}</strong></div>`;
    }

    // The lab was deleted or the link is wrong: replace the whole activity area.
    function showLabUnavailable() {
      labNameEl.textContent = 'Lab TA';
      document.title = 'Lab TA — Link not available';
      ttsBtn.style.display = 'none';
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      showStudentUnavailable('This lab link is no longer available. Ask your instructor for the current link.');
    }

    // ── Rendering helpers ──────────────────────────────────────────────────────
    function appendMessage(role, text) {
      const row = document.createElement('div');
      row.className = `msg-row ${role === 'user' ? 'user' : 'ta'}`;

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = role === 'user' ? '🧑' : '🧪';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;

      if (role === 'ta') {
        const inner = document.createElement('div');
        inner.style.display = 'flex';
        inner.style.flexDirection = 'column';
        const label = document.createElement('span');
        label.style.cssText = 'font-size:0.72rem;color:#888;margin-bottom:3px;font-weight:600;';
        label.textContent = 'Lab TA';
        inner.appendChild(label);
        inner.appendChild(bubble);
        row.appendChild(avatar);
        row.appendChild(inner);
      } else {
        row.appendChild(avatar);
        row.appendChild(bubble);
      }

      chatArea.appendChild(row);
      scrollToBottom();
      return bubble;
    }

    function showTyping() {
      const row = document.createElement('div');
      row.className = 'typing-row';
      row.id = 'typing-indicator';

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = '🧪';

      const dots = document.createElement('div');
      dots.className = 'typing-dots';
      dots.innerHTML = '<span></span><span></span><span></span>';

      row.appendChild(avatar);
      row.appendChild(dots);
      chatArea.appendChild(row);
      scrollToBottom();
    }

    function removeTyping() {
      const el = document.getElementById('typing-indicator');
      if (el) el.remove();
    }

    function scrollToBottom() {
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 3500);
    }

    // ── Send message ───────────────────────────────────────────────────────────
    async function sendMessage(text) {
      text = text.trim();
      if (!text) return;

      document.getElementById('welcome-msg')?.remove();
      textInput.value = '';
      sendBtn.disabled = true;

      appendMessage('user', text);
      showTyping();

      try {
        const res = await fetch(`/api/chat/${token}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: text,
            history: [...history],
            session_id: chatSessionId,
          }),
        });
        if (res.status === 404) { removeTyping(); showLabUnavailable(); return; }
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Server error');

        history.push({ role: 'user', text });
        history.push({ role: 'model', text: data.response });

        removeTyping();
        const taBubble = appendMessage('ta', data.response);
        if (window.MathJax) MathJax.typesetPromise([taBubble]);
        speakText(data.response);
      } catch (err) {
        removeTyping();
        showToast('Error: ' + err.message);
        // Put the text back so user can retry
        textInput.value = text;
      } finally {
        sendBtn.disabled = false;
        textInput.focus();
      }
    }

    sendBtn.addEventListener('click', () => sendMessage(textInput.value));
    textInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage(textInput.value);
      }
    });

    // ── TTS ────────────────────────────────────────────────────────────────────
    function speakText(text) {
      if (!ttsEnabled || !window.speechSynthesis) return;
      if (currentUtterance) window.speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(text);
      utt.rate = 0.9;
      currentUtterance = utt;
      const voices = window.speechSynthesis.getVoices();
      if (voices.length > 0) {
        window.speechSynthesis.speak(utt);
      } else {
        const onVoicesReady = () => {
          window.speechSynthesis.removeEventListener('voiceschanged', onVoicesReady);
          window.speechSynthesis.speak(utt);
        };
        window.speechSynthesis.addEventListener('voiceschanged', onVoicesReady);
      }
    }

    ttsBtn.addEventListener('click', () => {
      ttsEnabled = !ttsEnabled;
      ttsBtn.textContent = ttsEnabled ? '🔊' : '🔇';
      if (!ttsEnabled && window.speechSynthesis) window.speechSynthesis.cancel();
    });

    // ── Voice input ────────────────────────────────────────────────────────────
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let listening = false;

    if (!SpeechRecognition) {
      micBtn.style.display = 'none';
    } else {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onresult = (e) => {
        const transcript = e.results[0][0].transcript;
        textInput.value = transcript;
        stopListening();
        sendMessage(transcript);
      };

      recognition.onerror = () => stopListening();
      recognition.onend   = () => stopListening();

      micBtn.addEventListener('click', () => {
        if (listening) {
          recognition.stop();
          stopListening();
        } else {
          startListening();
        }
      });
    }

    function startListening() {
      listening = true;
      micBtn.classList.add('listening');
      textInput.placeholder = 'Listening...';
      recognition.start();
    }

    function stopListening() {
      listening = false;
      micBtn.classList.remove('listening');
      textInput.placeholder = 'Ask the TA...';
    }

    // ── Quiz ──────────────────────────────────────────────────────────────────
    const LS_STATE   = `labta_quiz_state_${token}`;
    const LS_CLEARED = `labta_cleared_${token}`;

    let quizData       = null;  // {quiz_id, questions:[...]}
    let roundQuestions = [];    // questions for current round
    let roundIndex     = 0;     // index into roundQuestions
    let roundAnswers   = {};    // {question_id: {correct, explanation, chosen}}
    let quizPhase      = 'idle';

    async function initQuiz() {
      if (localStorage.getItem(LS_CLEARED)) {
        if (!taEnabled) showQuizOnlyComplete();
        return;
      }

      let res;
      try {
        res = await fetch(`/quiz/active/${token}`);
      } catch {
        if (!taEnabled) showStudentUnavailable('No prelab quiz is currently available for this lab.');
        return;
      }
      if (!res.ok) {
        if (res.status === 404) { showLabUnavailable(); return; }
        if (!taEnabled) showStudentUnavailable('No prelab quiz is currently available for this lab.');
        return;
      }
      const data = await res.json();
      if (!data.quiz_id) {
        if (!taEnabled) showStudentUnavailable('No prelab quiz is currently available for this lab.');
        return;
      }

      quizData = data;

      let saved = null;
      try { saved = JSON.parse(localStorage.getItem(LS_STATE) || 'null'); } catch {}

      if (saved && saved.quiz_id === data.quiz_id) {
        roundQuestions = saved.roundQuestionIds
          .map(id => quizData.questions.find(q => q.id === id))
          .filter(Boolean);
        roundIndex   = saved.roundIndex;
        roundAnswers = saved.roundAnswers;
        quizPhase    = saved.phase;
      } else {
        roundQuestions = [...quizData.questions];
        roundIndex     = 0;
        roundAnswers   = {};
        quizPhase      = 'banner';
      }

      showQuizPanel();
      renderQuiz();
    }

    function saveQuizState() {
      if (quizPhase === 'cleared') { localStorage.removeItem(LS_STATE); return; }
      localStorage.setItem(LS_STATE, JSON.stringify({
        quiz_id: quizData.quiz_id,
        roundQuestionIds: roundQuestions.map(q => q.id),
        roundIndex,
        roundAnswers,
        phase: quizPhase,
      }));
    }

    function showQuizPanel() {
      document.getElementById('quiz-panel').style.display = 'flex';
      document.getElementById('chat-area').style.display  = 'none';
      document.getElementById('input-bar').style.display  = 'none';
    }

    function hideQuizPanel() {
      document.getElementById('quiz-panel').style.display = 'none';
      document.getElementById('chat-area').style.display  = 'flex';
      document.getElementById('input-bar').style.display  = taEnabled ? 'flex' : 'none';
    }

    function showQuizOnlyComplete() {
      const panel = document.getElementById('quiz-panel');
      panel.innerHTML = '';
      panel.style.display = 'flex';
      chatArea.style.display = 'none';
      document.getElementById('input-bar').style.display = 'none';
      setQuizFeedbackState('success');
      renderCleared(panel);
    }

    function setQuizFeedbackState(state) {
      const panel = document.getElementById('quiz-panel');
      panel.classList.remove(
        'quiz-feedback-default',
        'quiz-feedback-success',
        'quiz-feedback-warning',
        'quiz-feedback-danger'
      );
      panel.classList.add(`quiz-feedback-${state}`);
    }

    function renderQuiz() {
      const panel = document.getElementById('quiz-panel');
      panel.innerHTML = '';
      if (['banner', 'question', 'question-result'].includes(quizPhase)) {
        setQuizFeedbackState('default');
      }
      if      (quizPhase === 'banner')           renderBanner(panel);
      else if (quizPhase === 'question')         renderQuestion(panel);
      else if (quizPhase === 'question-result')  renderQuestionResult(panel);
      else if (quizPhase === 'round-complete')   renderRoundComplete(panel);
      else if (quizPhase === 'cleared')          renderCleared(panel);
      saveQuizState();
    }

    function qEsc(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function renderBanner(panel) {
      setQuizFeedbackState('default');
      const card = document.createElement('div');
      card.className = 'quiz-card';
      card.innerHTML = `
        <div class="quiz-icon">📋</div>
        <h2>Prelab Quiz Required</h2>
        <p>Answer all questions correctly to begin the lab. Wrong answers can be retried — you'll only repeat the ones you missed.</p>
        <button class="btn-quiz" onclick="startQuiz()">Start Quiz</button>
      `;
      panel.appendChild(card);
    }

    function startQuiz() {
      setQuizFeedbackState('default');
      roundQuestions = [...quizData.questions];
      roundIndex     = 0;
      roundAnswers   = {};
      quizPhase      = 'question';
      renderQuiz();
    }

    function renderQuestion(panel) {
      setQuizFeedbackState('default');
      const q = roundQuestions[roundIndex];
      const label = document.createElement('div');
      label.className = 'quiz-progress-label';
      label.textContent = `Question ${roundIndex + 1} of ${roundQuestions.length}`;

      const card = document.createElement('div');
      card.className = 'quiz-card';
      card.innerHTML = `
        <p class="quiz-question-text">${qEsc(q.question)}</p>
        <div class="quiz-choices" id="choices-wrap">
          ${['A','B','C','D'].map(l => `
            <label class="choice-opt">
              <input type="radio" name="q${q.id}" value="${l}" />
              <span class="choice-letter">${l}</span>
              <span class="choice-text">${qEsc(q.choices[l])}</span>
            </label>
          `).join('')}
        </div>
        <button class="btn-quiz" id="submit-q-btn" disabled onclick="submitAnswer(${q.id})">Submit Answer</button>
      `;

      panel.appendChild(label);
      panel.appendChild(card);

      card.querySelectorAll(`input[name="q${q.id}"]`).forEach(r => {
        r.addEventListener('change', () => {
          document.getElementById('submit-q-btn').disabled = false;
        });
      });
    }

    async function submitAnswer(questionId) {
      const selected = document.querySelector(`input[name="q${questionId}"]:checked`);
      if (!selected) return;
      const btn = document.getElementById('submit-q-btn');
      btn.disabled = true;
      btn.textContent = 'Checking…';

      try {
        const res = await fetch(`/quiz/${quizData.quiz_id}/submit`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ answers: { [questionId]: selected.value } }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Server error');

        const result = data.results[questionId];
        roundAnswers[questionId] = {
          correct:     result.correct,
          explanation: result.explanation,
          chosen:      selected.value,
        };
        quizPhase = 'question-result';
        renderQuiz();
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Submit Answer';
        showToast('Error: ' + err.message);
      }
    }

    function renderQuestionResult(panel) {
      const q   = roundQuestions[roundIndex];
      const ans = roundAnswers[q.id];
      const isLast = roundIndex === roundQuestions.length - 1;

      const label = document.createElement('div');
      label.className = 'quiz-progress-label';
      label.textContent = `Question ${roundIndex + 1} of ${roundQuestions.length}`;

      const card = document.createElement('div');
      card.className = 'quiz-card';
      card.innerHTML = `
        <p class="quiz-question-text">${qEsc(q.question)}</p>
        <div class="quiz-choices">
          ${['A','B','C','D'].map(l => {
            let cls = 'choice-opt disabled';
            if (l === ans.chosen && ans.correct)  cls += ' is-correct';
            if (l === ans.chosen && !ans.correct) cls += ' is-wrong';
            return `<label class="${cls}">
              <input type="radio" name="qr${q.id}" value="${l}" disabled ${l===ans.chosen?'checked':''} />
              <span class="choice-letter">${l}</span>
              <span class="choice-text">${qEsc(q.choices[l])}</span>
            </label>`;
          }).join('')}
        </div>
        <div class="quiz-feedback ${ans.correct ? 'correct' : 'wrong'}">
          ${ans.correct ? '✓ Correct!' : `✗ Incorrect. ${qEsc(ans.explanation || '')}`}
        </div>
        <button class="btn-quiz" onclick="nextQuestion()">${isLast ? 'See Results' : 'Next Question'}</button>
      `;

      panel.appendChild(label);
      panel.appendChild(card);
    }

    function nextQuestion() {
      if (roundIndex < roundQuestions.length - 1) {
        roundIndex++;
        quizPhase = 'question';
      } else {
        quizPhase = 'round-complete';
      }
      renderQuiz();
    }

    function renderRoundComplete(panel) {
      const failed = roundQuestions.filter(q => !roundAnswers[q.id]?.correct);
      if (failed.length === 0) {
        setQuizFeedbackState('success');
      } else if (failed.length === 1) {
        setQuizFeedbackState('warning');
      } else if (failed.length > 1) {
        setQuizFeedbackState('danger');
      }

      if (failed.length === 0) {
        quizPhase = 'cleared';
        localStorage.setItem(LS_CLEARED, '1');
        localStorage.removeItem(LS_STATE);
        renderQuiz();
        return;
      }

      const correct = roundQuestions.length - failed.length;
      const card = document.createElement('div');
      card.className = 'quiz-card';
      card.innerHTML = `
        <div class="round-score">${correct} / ${roundQuestions.length} correct</div>
        <p>Almost there! Retry the ${failed.length} question${failed.length > 1 ? 's' : ''} below:</p>
        <ul class="failed-list">
          ${failed.map((q, i) => `<li>${i+1}. ${qEsc(q.question.length > 90 ? q.question.slice(0,87)+'…' : q.question)}</li>`).join('')}
        </ul>
        <button class="btn-quiz" onclick="retryFailed()">Retry Failed Questions</button>
      `;
      panel.appendChild(card);
    }

    function retryFailed() {
      setQuizFeedbackState('default');
      const failedIds = new Set(
        Object.entries(roundAnswers)
          .filter(([, a]) => !a.correct)
          .map(([id]) => parseInt(id))
      );
      roundQuestions = quizData.questions.filter(q => failedIds.has(q.id));
      roundIndex     = 0;
      roundAnswers   = {};
      quizPhase      = 'question';
      renderQuiz();
    }

    function renderCleared(panel) {
      const card = document.createElement('div');
      card.className = 'quiz-card';
      if (!taEnabled) {
        card.innerHTML = `
          <div class="quiz-icon">✅</div>
          <h2>Quiz complete</h2>
          <p>All correct! There are no additional online activities for this lab right now.</p>
        `;
        panel.appendChild(card);
        return;
      }
      card.innerHTML = `
        <div class="quiz-icon">✅</div>
        <h2>You're cleared!</h2>
        <p>All correct! You're cleared to begin the lab.</p>
        <button class="btn-quiz" onclick="proceedToChat()">Start Lab</button>
      `;
      panel.appendChild(card);
    }

    function proceedToChat() {
      if (taEnabled) hideQuizPanel();
    }

    // ── PWA: Add to Home Screen prompt ────────────────────────────────────────
    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    if (isMobile && !window.matchMedia('(display-mode: standalone)').matches) {
      setTimeout(() => {
        const banner = document.getElementById('a2hs-banner');
        banner.style.display = 'block';
      }, 30000);
    }

    function dismissA2HS() {
      document.getElementById('a2hs-banner').style.display = 'none';
    }
  </script>
</body>
</html>
