<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab TA — Link not available</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    main {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      padding: 2rem 1.75rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
    h1 { font-size: 1.35rem; margin-bottom: 0.75rem; }
    p { color: #555; line-height: 1.55; font-size: 0.98rem; }
    p + p { margin-top: 0.75rem; }
    .instructor {
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid #eee;
      font-size: 0.85rem;
      color: #777;
    }
  </style>
</head>
<body>
  <main>
    <div class="icon">🧪</div>
    <h1>This Lab TA link is not available</h1>
    <p>The lab may have been removed by the instructor, or the link may have been copied incorrectly.</p>
    <p>Students: ask your instructor for the current link or QR code.</p>
    <p class="instructor">Instructors: current dashboard links can be recovered from the saved-labs index on the server.</p>
  </main>
</body>
</html>
